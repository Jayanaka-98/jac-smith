name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install jac
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash -s -- --version 0.37.25
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git for the history and review tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: jac --version

      - name: Type-check
        run: jac check main.jac

      - name: Tests
        run: |
          for t in tests/*_tests.jac; do
            echo "::group::$t"
            jac test "$t"
            echo "::endgroup::"
          done
